name: QA Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (required by Allure commandline)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          rfbrowser init

      - name: Start fake client portal
        run: |
          python -m http.server 8000 --directory app &
          timeout 30 bash -c 'until curl -sf http://127.0.0.1:8000/index.html > /dev/null; do sleep 1; done'

      - name: Run Robot Framework suite
        run: |
          robot --outputdir output --listener allure_robotframework:output/allure tests/

      - name: Generate Allure report
        if: always()
        run: |
          npm install -g allure-commandline --silent
          allure generate output/allure --clean -o output/allure-report

      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: output/
