name: QA Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          rfbrowser init

      - name: Start fake client portal
        run: |
          python -m http.server 8000 --directory app &
          sleep 2

      - name: Run Robot Framework suite
        run: |
          robot --outputdir output --listener allure_robotframework:output/allure tests/

      - name: Upload Robot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-report
          path: output/
