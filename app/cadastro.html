<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro de Cliente — Portal do Cliente</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Aurora Serviços</span>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="cadastro.html" class="active" data-testid="menu-cadastro">Cadastro de Cliente</a>
      <a href="cotacoes.html" data-testid="menu-cotacoes">Cotações</a>
      <a href="pedidos.html" data-testid="menu-pedidos">Pedidos</a>
      <a href="senha.html" data-testid="menu-senha">Alterar Senha</a>
      <button class="logout-btn" id="logout-btn" data-testid="logout-btn">Sair</button>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Cadastro de Cliente</h1>

      <form id="cadastro-form" novalidate>
        <div class="form-grid">
          <div>
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" data-testid="cadastro-nome" required>
          </div>
          <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" data-testid="cadastro-email" required>
          </div>
          <div>
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" data-testid="cadastro-cpf" required>
          </div>
          <div>
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" data-testid="cadastro-telefone" required>
          </div>
        </div>

        <button type="submit" data-testid="cadastro-submit">Cadastrar</button>
        <p class="success" id="cadastro-success" data-testid="cadastro-success" hidden>Cliente cadastrado com sucesso!</p>
      </form>
    </div>

    <div class="card">
      <h2>Clientes cadastrados</h2>
      <table data-testid="tabela-clientes">
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>CPF</th><th>Telefone</th></tr>
        </thead>
        <tbody id="clientes-tbody"></tbody>
      </table>
      <p class="empty-state" id="clientes-vazio" hidden>Nenhum cliente cadastrado ainda.</p>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cadastro.js"></script>
</body>
</html>
