<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cotações — Portal do Cliente</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Aurora Serviços</span>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="cadastro.html" data-testid="menu-cadastro">Cadastro de Cliente</a>
      <a href="cotacoes.html" class="active" data-testid="menu-cotacoes">Cotações</a>
      <a href="pedidos.html" data-testid="menu-pedidos">Pedidos</a>
      <a href="senha.html" data-testid="menu-senha">Alterar Senha</a>
      <button class="logout-btn" id="logout-btn" data-testid="logout-btn">Sair</button>
    </nav>
  </header>

  <main class="page">
    <div class="card">
      <h1>Nova Cotação</h1>
      <form id="cotacao-form" novalidate>
        <div class="form-grid">
          <div>
            <label for="produto">Produto</label>
            <select id="produto" data-testid="cotacao-produto" required>
              <option value="">Selecione...</option>
              <option value="Plano Essencial">Plano Essencial</option>
              <option value="Plano Família">Plano Família</option>
              <option value="Plano Premium">Plano Premium</option>
            </select>
          </div>
          <div>
            <label for="quantidade">Quantidade de vidas</label>
            <input type="number" id="quantidade" data-testid="cotacao-quantidade" min="1" value="1" required>
          </div>
        </div>
        <button type="submit" data-testid="cotacao-submit">Adicionar cotação</button>
      </form>
    </div>

    <div class="card">
      <h2>Cotações em andamento</h2>
      <table data-testid="tabela-cotacoes">
        <thead>
          <tr><th>Produto</th><th>Vidas</th><th></th></tr>
        </thead>
        <tbody id="cotacoes-tbody"></tbody>
      </table>
      <p class="empty-state" id="cotacoes-vazio" hidden>Nenhuma cotação em andamento.</p>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/cotacoes.js"></script>
</body>
</html>
